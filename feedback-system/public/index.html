<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 550px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 8px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
      border-left: 3px solid #667eea;
      padding-left: 12px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    
    .required {
      color: #e53e3e;
    }
    
    input, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .success {
      color: #2e7d32;
      margin-top: 20px;
      padding: 12px;
      background: #e8f5e9;
      border-radius: 10px;
      border-left: 4px solid #4caf50;
    }
    
    .error {
      color: #c62828;
      margin-top: 20px;
      padding: 12px;
      background: #ffebee;
      border-radius: 10px;
      border-left: 4px solid #f44336;
    }
    
    .info-box {
      margin-top: 25px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
      font-size: 12px;
      color: #666;
    }
    
    .info-box strong {
      color: #333;
      display: block;
      margin-bottom: 8px;
    }
    
    .info-box ul {
      margin-left: 20px;
      margin-top: 5px;
    }
    
    .info-box li {
      margin: 5px 0;
    }
    
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error-input {
      border-color: #f44336 !important;
      background: #ffebee !important;
    }
    
    .char-counter {
      font-size: 11px;
      color: #718096;
      margin-top: 5px;
      text-align: right;
    }
    
    .char-counter.warning {
      color: #ecc94b;
    }
    
    .char-counter.danger {
      color: #e53e3e;
    }
    
    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }
      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Share Your Feedback</h1>
    <div class="subtitle">We value your opinion and continuously improve</div>
    
    <form id="feedbackForm">
      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" id="name" placeholder="Enter your full name" autocomplete="off" maxlength="100" />
      </div>
      
      <div class="form-group">
        <label>Email Address <span class="required">*</span></label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="off" />
      </div>
      
      <div class="form-group">
        <label>Your Feedback <span class="required">*</span></label>
        <textarea id="feedback" placeholder="Tell us what you think..." maxlength="2000"></textarea>
        <div id="charCounter" class="char-counter">2000 characters remaining</div>
      </div>
      
      <button type="submit" id="submitBtn">Submit Feedback</button>
    </form>
    
    <div id="messageContainer"></div>
    
    <div class="info-box">
      <strong>🔒 Security Features Implemented:</strong>
      <ul>
        <li>✅ XSS Protection (HTML escaped)</li>
        <li>✅ Rate Limiting (5 requests/minute)</li>
        <li>✅ Email Validation (strict regex)</li>
        <li>✅ Input Sanitization</li>
      </ul>
    </div>
  </div>
  
  <script>
    // Get DOM elements
    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageContainer = document.getElementById('messageContainer');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const feedbackInput = document.getElementById('feedback');
    const charCounter = document.getElementById('charCounter');
    
    // API URL
    const API_URL = '/api/feedback';
    
    // Character counter
    feedbackInput.addEventListener('input', function() {
      const remaining = 2000 - this.value.length;
      charCounter.textContent = remaining + ' characters remaining';
      
      if (remaining < 0) {
        charCounter.className = 'char-counter danger';
      } else if (remaining < 100) {
        charCounter.className = 'char-counter warning';
      } else {
        charCounter.className = 'char-counter';
      }
    });
    
    // Email validation function
    function isValidEmail(email) {
      const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
      return emailRegex.test(email);
    }
    
    // Escape HTML
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    // Show message
    function showMessage(type, text) {
      const messageDiv = document.createElement('div');
      messageDiv.className = type;
      messageDiv.innerHTML = (type === 'success' ? '✅ ' : '❌ ') + escapeHtml(text);
      messageContainer.innerHTML = '';
      messageContainer.appendChild(messageDiv);
      
      if (type === 'success') {
        setTimeout(function() {
          if (messageDiv.parentNode) {
            messageDiv.style.opacity = '0';
            setTimeout(function() {
              if (messageDiv.parentNode) messageDiv.remove();
            }, 300);
          }
        }, 5000);
      }
    }
    
    // Clear error styles
    function clearErrorStyles() {
      nameInput.classList.remove('error-input');
      emailInput.classList.remove('error-input');
      feedbackInput.classList.remove('error-input');
    }
    
    // Show error style
    function showErrorStyle(input) {
      input.classList.add('error-input');
      setTimeout(function() {
        input.classList.remove('error-input');
      }, 3000);
    }
    
    // Validate form
    function validateForm(name, email, feedback) {
      if (!name.trim()) {
        showMessage('error', 'Please enter your name');
        showErrorStyle(nameInput);
        nameInput.focus();
        return false;
      }
      
      if (!email.trim()) {
        showMessage('error', 'Please enter your email address');
        showErrorStyle(emailInput);
        emailInput.focus();
        return false;
      }
      
      if (!feedback.trim()) {
        showMessage('error', 'Please enter your feedback');
        showErrorStyle(feedbackInput);
        feedbackInput.focus();
        return false;
      }
      
      if (name.trim().length < 2) {
        showMessage('error', 'Name must be at least 2 characters long');
        showErrorStyle(nameInput);
        nameInput.focus();
        return false;
      }
      
      if (name.trim().length > 100) {
        showMessage('error', 'Name must be less than 100 characters');
        showErrorStyle(nameInput);
        nameInput.focus();
        return false;
      }
      
      if (!isValidEmail(email)) {
        showMessage('error', 'Please enter a valid email address (e.g., name@domain.com)');
        showErrorStyle(emailInput);
        emailInput.focus();
        return false;
      }
      
      if (feedback.trim().length < 5) {
        showMessage('error', 'Feedback must be at least 5 characters long');
        showErrorStyle(feedbackInput);
        feedbackInput.focus();
        return false;
      }
      
      return true;
    }
    
    // Handle form submission
    async function handleSubmit(e) {
      e.preventDefault();
      
      const name = nameInput.value;
      const email = emailInput.value;
      const feedback = feedbackInput.value;
      
      if (!validateForm(name, email, feedback)) {
        return;
      }
      
      // Disable button and show loading
      submitBtn.disabled = true;
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span class="spinner"></span> Submitting...';
      
      messageContainer.innerHTML = '';
      clearErrorStyles();
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: name.trim(),
            email: email.trim(),
            feedback: feedback.trim()
          })
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          showMessage('success', result.message + ' Thank you for your feedback!');
          form.reset();
          charCounter.textContent = '2000 characters remaining';
          charCounter.className = 'char-counter';
        } else {
          showMessage('error', result.error || 'Submission failed. Please try again.');
          
          if (result.error && result.error.toLowerCase().includes('email')) {
            showErrorStyle(emailInput);
          } else if (result.error && result.error.toLowerCase().includes('name')) {
            showErrorStyle(nameInput);
          } else if (result.error && result.error.toLowerCase().includes('feedback')) {
            showErrorStyle(feedbackInput);
          }
        }
      } catch (error) {
        console.error('Error:', error);
        if (!navigator.onLine) {
          showMessage('error', 'No internet connection. Please check your network.');
        } else {
          showMessage('error', 'Unable to connect to server. Please try again.');
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    }
    
    // Real-time email validation
    emailInput.addEventListener('blur', function() {
      const email = this.value;
      if (email && !isValidEmail(email)) {
        this.classList.add('error-input');
      } else {
        this.classList.remove('error-input');
      }
    });
    
    // Remove error class on focus
    nameInput.addEventListener('focus', function() {
      this.classList.remove('error-input');
    });
    
    emailInput.addEventListener('focus', function() {
      this.classList.remove('error-input');
    });
    
    feedbackInput.addEventListener('focus', function() {
      this.classList.remove('error-input');
    });
    
    // Form submit event
    form.addEventListener('submit', handleSubmit);
    
    console.log('Feedback form loaded successfully');
  </script>
</body>
</html>
